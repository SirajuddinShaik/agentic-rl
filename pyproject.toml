[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-rl"
version = "0.1.0"
description = "Xyne, Polar, and Miles agentic RL training system"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "httpx>=0.27",
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
]
embeddings = ["sentence-transformers>=3"]

[project.scripts]
polar = "polar.cli:main"
xyne-submit = "polar.xyne.submit_tasks:main"

[tool.setuptools]
package-dir = {"" = "polar-pkg"}

[tool.setuptools.packages.find]
where = ["polar-pkg"]
include = ["polar*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 119
