global:
  scrape_interval: 30s
  evaluation_interval: 30s
  scrape_timeout: 10s

scrape_configs:
  - job_name: prometheus
    scrape_interval: 30s
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: ocr-autoscaler
    scrape_interval: 30s
    metrics_path: /metrics
    static_configs:
      - targets:
          - xyne-ocr-autoscaler:3021

  - job_name: ocr-vllm-direct
    scrape_interval: 30s
    scrape_timeout: 5s
    metrics_path: /metrics
    http_sd_configs:
      - url: http://xyne-ocr-autoscaler:3021/prometheus/targets/vllm
        refresh_interval: 30s

  - job_name: xyne-app
    scrape_interval: 30s
    metrics_path: /metrics
    static_configs:
      - targets:
          - xyne-app:3000

  - job_name: xyne-app-sync
    scrape_interval: 30s
    metrics_path: /metrics
    static_configs:
      - targets:
          - xyne-app-sync:3010

  - job_name: cadvisor
    scrape_interval: 15s
    static_configs:
      - targets:
          - cadvisor:8080

  - job_name: node-exporter
    scrape_interval: 15s
    static_configs:
      - targets:
          - node-exporter:9100

  - job_name: postgres-exporter
    scrape_interval: 30s
    static_configs:
      - targets:
          - postgres-exporter:9187

  - job_name: redis-exporter
    scrape_interval: 15s
    static_configs:
      - targets:
          - redis-exporter:9121

  - job_name: grafana
    scrape_interval: 30s
    metrics_path: /metrics
    static_configs:
      - targets:
          - grafana:3000

  - job_name: loki
    scrape_interval: 30s
    metrics_path: /metrics
    static_configs:
      - targets:
          - loki:3100

  - job_name: alloy
    scrape_interval: 30s
    metrics_path: /metrics
    static_configs:
      - targets:
          - alloy:12345

  - job_name: vespa
    scrape_interval: 30s
    metrics_path: /prometheus/v1/values
    static_configs:
      - targets:
          - vespa:8080
