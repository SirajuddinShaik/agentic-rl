global
  log stdout format raw local0

defaults
  mode http
  log global
  option httplog
  option dontlognull
  timeout connect 5s
  timeout client 300s
  timeout server 300s

frontend a100_http
  bind *:8000
  http-request return status 200 content-type text/plain lf-string "ok\n" if { path /health }
  default_backend a100_fleet

backend a100_fleet
  balance roundrobin
  option httpchk GET /health
  server light-ocr-bbox light-ocr-bbox:8000 check
  server lighton-ocr-bbox lighton-ocr-bbox:8000 check
