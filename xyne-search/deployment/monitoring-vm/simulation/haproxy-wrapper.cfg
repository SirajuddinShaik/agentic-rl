global
  log stdout format raw local0

defaults
  mode http
  log global
  option httplog
  option dontlognull
  timeout connect 5s
  timeout client 300s
  timeout server 300s

frontend wrapper_bbox_http
  bind *:8000
  http-request return status 200 content-type text/plain lf-string "ok\n" if { path /health }
  default_backend wrapper_bbox_fleet

backend wrapper_bbox_fleet
  balance roundrobin
  option httpchk GET /health
  server xyne-wrapper-lighton-1 xyne-wrapper-lighton-1:8000 check
  server xyne-wrapper-lighton-2 xyne-wrapper-lighton-2:8000 check
