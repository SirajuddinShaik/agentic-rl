global
  log stdout format raw local0

defaults
  mode http
  log global
  option httplog
  option dontlognull
  timeout connect 5s
  timeout client 300s
  timeout server 300s

frontend docling_server_http
  bind *:8000
  http-request return status 200 content-type text/plain lf-string "ok\n" if { path /health }
  default_backend wrapper_lb

backend wrapper_lb
  balance roundrobin
  option httpchk GET /health
  server xyne-wrapper-lb xyne-wrapper-lb:8000 check
