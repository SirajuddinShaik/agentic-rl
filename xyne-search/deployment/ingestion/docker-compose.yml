name: xyne-stack

x-ingestion-env: &ingestion-env
  NODE_ENV: production
  DATABASE_HOST: xyne-db
  DATABASE_PORT: "5432"
  DATABASE_USER: xyne
  DATABASE_PASSWORD: xyne
  DATABASE_URL: postgresql://xyne:xyne@xyne-db:5432/xyne?sslmode=disable
  POSTGRES_PASSWORD: xyne
  VESPA_HOST: vespa
  VESPA_FEED_PORT: "8080"
  VESPA_QUERY_PORT: "8081"
  VESPA_REQUIRED: "false"
  MAIN_SERVER_HOST: app
  HOST: https://demo.xyne.juspay.io
  REDIS_URL: redis://redis:6379/0
  DOCLING_ENABLED: "true"
  DOCLING_SERVICE_URL: http://10.2.0.83
  DOCLING_TIMEOUT_MS: "900000"
  DOCLING_PAGE_CHUNK_SIZE: "25"
  DOCLING_STREAMING_MIN_PAGES: "101"
  DOCLING_ASYNC_ENABLED: "true"
  DOCLING_ASYNC_SCHEDULER_ENABLED: "true"
  DOCLING_RESULTS_STREAM: docling:results
  DOCLING_SCHEDULER_RESULT_GROUP: app-sync-scheduler
  DOCLING_RUNTIME_CONFIG_KEY: docling:runtime-config
  DOCLING_RUNTIME_CONFIG_POLL_MS: "30000"
  DOCLING_RESULT_CONCURRENCY: "1"
  DOCLING_RESULT_READ_COUNT: "50"
  DOCLING_RESULT_MIN_IDLE_MS: "60000"
  DOCLING_ASYNC_SUBMIT_PERMITS_ENABLED: "true"
  DOCLING_ASYNC_SUBMIT_PERMITS: "240"
  DOCLING_ASYNC_SUBMIT_PERMIT_LEASE_TTL_MS: "21600000"
  DOCLING_SCHEDULER_SUBMITTED_TIMEOUT_MS: "1800000"
  DOCLING_SCHEDULER_POLL_MS: "1000"
  DOCLING_SCHEDULER_ADMISSION_POLL_MS: "1000"
  DOCLING_SCHEDULER_SUBMIT_CLAIM_BATCH_SIZE: "32"
  DOCLING_SCHEDULER_MAX_CONCURRENT_CLAIMERS: "1"
  DOCLING_SCHEDULER_SUBMIT_PREFETCH_MULTIPLIER: "0"
  DOCLING_SCHEDULER_SLOW_ADMIT_MS: "500"
  DOCLING_SCHEDULER_SLOW_CLAIM_MS: "500"
  DOCLING_SCHEDULER_SLOW_READ_PART_MS: "1000"
  DOCLING_SCHEDULER_SLOW_SUBMIT_MS: "5000"
  DOCLING_SCHEDULER_SUBMITTER_SHUTDOWN_DRAIN_MS: "180000"
  DOCLING_SCHEDULER_LEASE_MS: "900000"
  DOCLING_SCHEDULER_SPLIT_CONCURRENCY: "8"
  DOCLING_SCHEDULER_MAX_INFLIGHT_PAGES: "24000"
  DOCLING_SCHEDULER_TARGET_ACTIVE_OCR_FILES: "60"
  DOCLING_SCHEDULER_PER_FILE_INFLIGHT_PAGES: "400"
  DOCLING_SCHEDULER_PER_FILE_BURST_PAGES: "24000"
  DOCLING_SCHEDULER_MAX_PART_ATTEMPTS: "3"
  DOCLING_SCHEDULER_MAX_SPLIT_ATTEMPTS: "3"
  DOCLING_SCHEDULER_MAX_WRITE_ATTEMPTS: "20"
  DOCLING_SCHEDULER_RETRY_BASE_MS: "30000"
  DOCLING_SCHEDULER_RETRY_MAX_MS: "1800000"
  DOCLING_SCHEDULER_VESPA_WRITE_PERMITS: "8"
  DOCLING_SCHEDULER_VESPA_WRITE_PERMIT_TTL_MS: "960000"
  DOCLING_SCHEDULER_VESPA_WRITE_TIMEOUT_MS: "660000"
  VESPA_DOCUMENT_UPDATE_TIMEOUT: "600s"
  DOCLING_SCHEDULER_MAX_VESPA_PAYLOAD_BYTES: "9437184"
  KB_STORAGE_ROOT: storage/kb_files
  DOCLING_ASYNC_STORAGE_ROOT: storage/doclingAsync
  APP_SYNC_PDF_LIB_CONCURRENCY: "8"
  APP_SYNC_PDF_LIB_SEMAPHORE_TIMEOUT_MS: "600000"
  APP_SYNC_PDF_LIB_ACTIVE_TIMEOUT_MS: "300000"
  QPDF_TIMEOUT_MS: "300000"
  DB_POOL_MAX: "5"
  DB_POOL_IDLE_TIMEOUT: "30"
  LITELLM_MODEL_CONFIG_PATH: /usr/src/app/server/litellm-models.json

x-ingestion-worker: &ingestion-worker
  image: ${INGESTION_IMAGE:?set INGESTION_IMAGE}
  user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
  env_file:
    - path: .env
      required: false
  environment:
    <<: *ingestion-env
  volumes:
    - ${XYNE_DATA_DIR:-./data}/app-uploads:/usr/src/app/server/storage
    - ${XYNE_DATA_DIR:-./data}/app-logs:/usr/src/app/server/logs
    - ${XYNE_DATA_DIR:-./data}/app-downloads:/usr/src/app/server/downloads
    - ./litellm-models.json:/usr/src/app/server/litellm-models.json:ro
  networks:
    - xyne
  restart: unless-stopped
  extra_hosts:
    - "host.docker.internal:host-gateway"
  command: ["bun", "doclingSchedulerWorker.ts"]
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "6"

x-submitter: &submitter
  <<: *ingestion-worker
  stop_grace_period: 200s
  environment:
    <<: *ingestion-env
    DOCLING_SCHEDULER_ROLE: submitter

x-result-worker: &result-worker
  <<: *ingestion-worker
  environment:
    <<: *ingestion-env
    DOCLING_SCHEDULER_ROLE: result

services:
  app-sync:
    <<: *ingestion-worker
    profiles: ["app-sync"]
    container_name: xyne-app-sync
    ports:
      - "3010:3010"
    environment:
      <<: *ingestion-env
      DOCLING_ASYNC_SCHEDULER_ENABLED: "true"
      DOCLING_RUNTIME_CONFIG_KEY: docling:runtime-config
      DOCLING_RUNTIME_CONFIG_POLL_MS: "30000"
      DOCLING_PAGE_CHUNK_SIZE: "200"
      DOCLING_RESULT_GROUP: app-sync
      DOCLING_ACTIVE_FILE_LIMIT: "160"
      DOCLING_ASYNC_SUBMIT_PERMIT_POLL_MS: "10000"
      DOCLING_ASYNC_PART_SUBMIT_CONCURRENCY: "1"
      DOCLING_ASYNC_SUBMIT_RETRIES: "30"
      DOCLING_ASYNC_SUBMIT_RETRY_DELAY_MS: "2000"
      PDF_FILE_PROCESSING_WORKER_THREADS: "4"
      PDF_FILE_PROCESSING_TEAM_SIZE: "1"
      FILE_PROCESSING_WORKER_THREADS: "1"
      FILE_PROCESSING_TEAM_SIZE: "1"
      APP_SYNC_PDF_LIB_CONCURRENCY: "4"
      DB_POOL_MAX: "20"
      PGBOSS_POOL_MAX: "20"
      DB_APPLICATION_NAME: xyne-drizzle-sync
      PGBOSS_APPLICATION_NAME: xyne-pgboss-sync
      PDF_PROCESSING_DISABLE_FALLBACKS: "true"
      DISABLE_INTEGRATION_SYNC_WORKERS: "false"
      DISABLE_APP_SYNC_PROCESSING_WORKERS: "false"
      APP_SYNC_HEALTH_CURL_TIMEOUT_SECONDS: "10"
      APP_SYNC_HEALTH_START_GRACE_SECONDS: "180"
      APP_SYNC_HEALTH_MAX_FAILURES: "3"
      APP_SYNC_DIAGNOSTICS_ENABLED: "true"
      APP_SYNC_DIAGNOSTICS_DIR: /usr/src/app/server/logs/app-sync-diagnostics
      APP_SYNC_RESOURCE_SAMPLE_INTERVAL_MS: "2000"
      VESPA_MAX_RETRY_ATTEMPTS: "4"
      VESPA_RETRY_DELAY_MS: "4000"
    volumes:
      - ${XYNE_DATA_DIR:-./data}/app-uploads:/usr/src/app/server/storage
      - ${XYNE_DATA_DIR:-./data}/app-logs:/usr/src/app/server/logs
      - ${XYNE_DATA_DIR:-./data}/app-assets:/usr/src/app/server/dist/assets/videos
      - ${XYNE_DATA_DIR:-./data}/app-migrations:/usr/src/app/server/migrations
      - ${XYNE_DATA_DIR:-./data}/app-downloads:/usr/src/app/server/downloads
      - ./litellm-models.json:/usr/src/app/server/litellm-models.json:ro
    command: ["bun", "run", "sync-server.ts"]
    healthcheck:
      test: ["CMD", "sh", "/usr/src/app/server/scripts/app-sync-healthcheck.sh"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 180s

  app-sync-result-worker:
    <<: *ingestion-worker
    container_name: xyne-stack-app-sync-result-worker-1
    environment:
      <<: *ingestion-env
      DOCLING_ASYNC_SCHEDULER_ENABLED: "false"
      DOCLING_RESULT_GROUP: app-sync
      DOCLING_ACTIVE_FILE_LIMIT: "160"
      DOCLING_ASYNC_SUBMIT_PERMIT_POLL_MS: "10000"
      DOCLING_RESULT_CONCURRENCY: "1"
      DOCLING_RESULT_READ_COUNT: "1"
      DB_APPLICATION_NAME: xyne-drizzle-docling-results
      DB_POOL_MAX: "10"
      APP_SYNC_DIAGNOSTICS_ENABLED: "true"
      APP_SYNC_DIAGNOSTICS_DIR: /usr/src/app/server/logs/app-sync-diagnostics
    command: ["bun", "run", "doclingResultWorker.ts"]

  docling-scheduler-splitter:
    <<: *ingestion-worker
    container_name: docling-scheduler-splitter
    environment:
      <<: *ingestion-env
      DOCLING_SCHEDULER_ROLE: splitter

  docling-scheduler-submitter:
    <<: *submitter
    container_name: docling-scheduler-submitter

  docling-scheduler-submitter-2:
    <<: *submitter
    profiles: ["submitter-spares"]
    container_name: docling-scheduler-submitter-2

