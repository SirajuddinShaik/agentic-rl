    <<: *result-worker
    container_name: docling-scheduler-result-4

  docling-scheduler-writer:
    <<: *ingestion-worker
    container_name: docling-scheduler-writer
    environment:
      <<: *ingestion-env
      DOCLING_SCHEDULER_ROLE: writer

  docling-scheduler-reaper:
    <<: *ingestion-worker
    container_name: docling-scheduler-reaper
    environment:
      <<: *ingestion-env
      DOCLING_SCHEDULER_ROLE: reaper

  ocr-autoscaler:
    image: ${INGESTION_IMAGE:?set INGESTION_IMAGE}
    container_name: xyne-ocr-autoscaler
    user: bun
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      DATABASE_HOST: xyne-db
      DATABASE_PORT: "5432"
      DATABASE_USER: xyne
      DATABASE_PASSWORD: xyne
      DATABASE_URL: postgresql://xyne:xyne@xyne-db:5432/xyne?sslmode=disable
      VESPA_HOST: vespa
      REDIS_URL: redis://xyne-redis:6379/0
      GCP_PROJECT: xyne-spaces-sbx
      GOOGLE_CLOUD_PROJECT: xyne-spaces-sbx
      GCP_ZONE: asia-southeast1-a
      OCR_AUTOSCALER_DRY_RUN: "false"
      OCR_AUTOSCALER_ONCE: "false"
      OCR_AUTOSCALER_INTERVAL_MS: "30000"
      OCR_AUTOSCALER_GCP_ACTUATOR: metadata
      OCR_AUTOSCALER_RESIZE_MIGS: "true"
      OCR_AUTOSCALER_WRITE_RUNTIME_CONFIG: "true"
      OCR_AUTOSCALER_METRICS_ENABLED: "true"
      OCR_AUTOSCALER_METRICS_PORT: "3021"
      OCR_AUTOSCALER_A100_DISCOVERY: mig
      OCR_AUTOSCALER_A100_MIG: lightonocr-fleet-mig
      OCR_AUTOSCALER_A100_MIN_NODES: "1"
      OCR_AUTOSCALER_A100_MAX_NODES: "62"
      OCR_AUTOSCALER_A100_CAPACITY_WAITING_SUSTAIN_MS: "180000"
      OCR_AUTOSCALER_WRAPPER_MIG: lighton-ocr-wrapper-fleet-mig
      OCR_AUTOSCALER_WRAPPER_MIN_NODES: "1"
      OCR_AUTOSCALER_WRAPPER_MAX_NODES: "16"
      OCR_AUTOSCALER_WRAPPER_BACKEND_SERVICE: lighton-ocr-wrapper-fleet-backend
      OCR_AUTOSCALER_WRAPPER_BACKEND_SERVICE_REGION: asia-southeast1
      OCR_AUTOSCALER_WRAPPER_HEALTH_PATH: /health
      OCR_AUTOSCALER_WRAPPER_HEALTH_TIMEOUT_MS: "15000"
      OCR_AUTOSCALER_WRAPPER_HEALTH_FAILURE_THRESHOLD: "5"
      OCR_AUTOSCALER_WRAPPER_ASYNC_MAX_INFLIGHT: "125"
      OCR_AUTOSCALER_WRAPPER_LIGHTON_CONCURRENCY: "250"
      OCR_AUTOSCALER_SUBMIT_PERMITS_PER_WRAPPER: "440"
      OCR_AUTOSCALER_ACTIVE_OCR_FILE_LIMIT: "10000"
      OCR_AUTOSCALER_SUBMITTER_CONTAINER_COUNT: "6"
      OCR_AUTOSCALER_SUBMITTER_COUNT_COMMAND: /usr/local/bin/count-docling-submitters.sh
      OCR_AUTOSCALER_SUBMITTER_SCALE_COMMAND: /usr/local/bin/scale-docling-submitters.sh {count}
      OCR_AUTOSCALER_SUBMITTER_FIXED_CONCURRENCY: "80"
      OCR_AUTOSCALER_SUBMITTER_PAGE_CHUNK_SIZE: "1"
      OCR_AUTOSCALER_SUBMITTER_PAGES_PER_SECOND_PER_CONTAINER: "120"
      OCR_AUTOSCALER_SUBMITTER_TARGET_FILL_SECONDS: "60"
      OCR_AUTOSCALER_PERMIT_FILL_TARGET: "0.85"
      OCR_AUTOSCALER_PERMIT_FILL_DOWNSCALE_TARGET: "0.95"
      SUBMITTER_CONTAINER_MIN: "1"
      OCR_COST_CONFIG_PATH: /etc/xyne/ocr-costs.json
    group_add:
      - "${DOCKER_SOCKET_GID:-999}"
    ports:
      - "3021:3021"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${OCR_COST_FILE:-/opt/monitoring/ocr-costs.json}:/etc/xyne/ocr-costs.json:ro
      - ${INGESTION_HELPER_DIR:-./deployment/ingestion/bin}/count-docling-submitters.sh:/usr/local/bin/count-docling-submitters.sh:ro
      - ${INGESTION_HELPER_DIR:-./deployment/ingestion/bin}/scale-docling-submitters.sh:/usr/local/bin/scale-docling-submitters.sh:ro
    networks:
      - xyne
    restart: unless-stopped
    command: ["bun", "run", "scripts/ocrAutoscaler.ts"]
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "6"

networks:
  xyne:
    external: true
    name: ${XYNE_DOCKER_NETWORK:-xyne-stack_xyne}
